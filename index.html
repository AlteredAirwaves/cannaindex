<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canna Index · Sector Intelligence</title>
    <meta name="description" content="Canna Index is being rebuilt. Sector intelligence for cannabis, coming back soon." />
    <meta property="og:title" content="Canna Index · Sector Intelligence" />
    <meta property="og:description" content="We're building V2. Back soon." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #EAF0E4;
        --dim: #9AA48C;
        --faint: #5D6552;
        --accent: #9BE564;
        --bg: #0A0F0A;
        --line: rgba(155, 229, 100, 0.15);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: 'Fraunces', Georgia, serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        overflow: hidden;
        position: relative;
      }
      /* soft ambient glow, pure CSS, no assets */
      body::before {
        content: "";
        position: absolute;
        top: 50%; left: 50%;
        width: 640px; height: 640px;
        transform: translate(-50%, -55%);
        background: radial-gradient(circle, rgba(155,229,100,0.14) 0%, rgba(155,229,100,0.04) 38%, transparent 68%);
        pointer-events: none;
      }
      .wrap {
        position: relative;
        text-align: center;
        max-width: 560px;
      }
      .badge {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--accent);
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 30px;
      }
      .dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 12px var(--accent);
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
      .logo {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        font-size: 15px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: var(--ink);
        margin-bottom: 28px;
      }
      .logo b { color: var(--accent); font-weight: 500; }
      h1 {
        font-family: 'Fraunces', serif;
        font-weight: 600;
        font-size: clamp(38px, 8vw, 68px);
        line-height: 1.02;
        letter-spacing: -0.02em;
        margin-bottom: 22px;
      }
      p {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13.5px;
        line-height: 1.7;
        letter-spacing: 0.02em;
        color: var(--dim);
        max-width: 440px;
        margin: 0 auto 34px;
      }
      .rule {
        width: 46px; height: 2px;
        background: var(--accent);
        margin: 0 auto 34px;
        opacity: 0.7;
      }
      .foot {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--faint);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">CANNA<b>INDEX</b></div>
      <div class="badge"><span class="dot"></span> V2 In Progress</div>
      <h1>Something sharper<br />is coming.</h1>
      <div class="rule"></div>
      <p>Canna Index is being rebuilt from the ground up: faster, deeper, and with more of the sector intelligence you came for. Back online soon.</p>
      <div class="foot">Sector Intelligence · Cannabis</div>
    </div>
  </body>
</html>
